
# Redirect binarycent.store to arxtrading.store
server {
    listen 80;
    listen [::]:80;
    server_name binarycent.store www.binarycent.store;
    return 301 https://arxtrading.store$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name binarycent.store www.binarycent.store;

    ssl_certificate /etc/letsencrypt/live/binarycent.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/binarycent.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://arxtrading.store$request_uri;
}

# Main site - arxtrading.store
server {
    listen 80;
    listen [::]:80;
    server_name arxtrading.store www.arxtrading.store;
    return 301 https://arxtrading.store$request_uri;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name arxtrading.store www.arxtrading.store;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/arxtrading.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arxtrading.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Proxy to Node.js app
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
